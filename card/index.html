<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محمد صلاح — بطاقة تواصل</title>
  <meta name="description" content="بطاقة تواصل سريعة مع محمد صلاح — بورتفوليو، لينكدإن، جيت هاب والسيرة الذاتية.">
  <meta name="theme-color" content="#F6F2EA">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <span class="mark" aria-hidden="true">MS</span>
      <div class="lang" role="group" aria-label="Language / اللغة">
        <button type="button" data-lang="ar" class="is-active">AR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>

    <section class="card" aria-labelledby="greeting">
      <div class="intro">
        <div class="portrait">
          <img src="assets/profile.png" id="portrait" alt="صورة محمد صلاح" width="96" height="96">
        </div>
        <div class="intro-copy">
          <p class="eyebrow" id="eyebrow">بطاقة تواصل</p>
          <h1 id="greeting">محمد صلاح</h1>
          <p class="role" id="role">محلل بيانات</p>
          <p class="bio" id="bio"></p>
        </div>
      </div>

      <div class="divider"><span id="links-title">روابط سريعة</span></div>
      <nav class="links" id="links" aria-label="روابط سريعة"></nav>
    </section>

    <footer class="foot"><span id="foot-text"></span></footer>
  </main>

  <script src="data-default.js"></script>
  <script src="app.js"></script>
</body>
</html>
